name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure public backend URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          url = os.environ['API_BASE_URL'].rstrip('/')
          parsed = urlsplit(url)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('Set repository variable API_BASE_URL to your HTTPS backend URL')
          Path('frontend/config.js').write_text('window.JEV_API_BASE_URL = ' + json.dumps(url) + ';\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - uses: actions/deploy-pages@v4
        id: deployment
