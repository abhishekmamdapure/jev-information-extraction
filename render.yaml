services:
  - type: web
    name: jev-pdf-api
    runtime: python
    buildCommand: pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_ORIGINS
        sync: false
